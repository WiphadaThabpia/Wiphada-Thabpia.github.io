<html>
<head>
    <meta charset="UTF-8">
    <title>My Paint Studio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }
        body{
            background:#f2f2f2;
        }
        .container{
            width:1100px;
            margin:20px auto;
            background:#fff;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }
        .header{
            background:#6ec4f6;
            color:white;
            text-align:center;
            font-size:30px;
            font-weight:bold;
            padding:15px;
        }
        .toolbar{
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
            padding:12px;
            background:#ececec;
            border-bottom:1px solid #ccc;
        }
        .tool{
            border:none;
            background:#2196F3;
            color:white;
            padding:8px 15px;
            border-radius:5px;
            cursor:pointer;
            transition:.2s;
        }
        .tool:hover{
            background:#1976D2;
        }
        .tool.active{
            background:#4CAF50;
        }
        .toolbar input[type=color]{
            width:40px;
            height:35px;
            border:none;
            cursor:pointer;
        }
        .toolbar input[type=range]{
            width:120px;
        }
        .canvasBox{
            width:900px;
            height:500px;
            margin:20px auto;
            position:relative;
            border:2px solid black;
            background:white;
        }
        canvas{
            position:absolute;
            left:0;
            top:0;
            cursor:crosshair;
        }
        #previewCanvas{
            pointer-events:none;
        }
        .status{
            padding:10px;
            text-align:center;
            background:#fafafa;
            border-top:1px solid #ddd;
        }
        #sizeValue{
        width:45px;
        text-align:center;
        font-weight:bold;
        color:#333;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">
        🎨My Paint Studio
    </div>
        <div class="toolbar">
        <button class="tool active" onclick="setTool('pencil',this)">✏ Pencil</button>
        <button class="tool" onclick="setTool('line',this)">📏 Line</button>
        <button class="tool" onclick="setTool('rect',this)">⬜ Rectangle</button>
        <button class="tool" onclick="setTool('circle',this)">⚪ Circle</button>
        <button class="tool" onclick="setTool('eraser',this)">🧽 Eraser</button>
        <button class="tool" onclick="setTool('fill',this)">🪣 Fill</button>

        <span>Color</span>
        <input type="color" id="colorPicker" value="#000000">

        <span>Size</span>
        <input
        type="range"
        id="sizeSlider"
        min="1"
        max="30"
        value="2">

<span id="sizeValue">2 px</span>

        <button class="tool" onclick="clearCanvas()">🗑 Clear</button>
    </div>

    <div class="canvasBox">
        <canvas id="canvas" width="900" height="500"></canvas>
        <canvas id="previewCanvas" width="900" height="500"></canvas>
    </div>

    <div class="status">
        Tool :
        <span id="toolName">Pencil</span>
    </div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const previewCanvas=document.getElementById("previewCanvas");
const previewCtx=previewCanvas.getContext("2d");

const colorPicker=document.getElementById("colorPicker");
const sizeSlider=document.getElementById("sizeSlider");
const sizeValue=document.getElementById("sizeValue");

let tool="pencil";
let drawing=false;

let startX=0;
let startY=0;

let lastX=0;
let lastY=0;

let color=colorPicker.value;
let size=parseInt(sizeSlider.value);
sizeValue.innerHTML=size+" px";

colorPicker.addEventListener("input",function(){
    color=this.value;
});

sizeSlider.addEventListener("input",function(){
    size=parseInt(this.value);
    sizeValue.innerHTML=size+" px";
});

function setTool(name,btn){

    tool=name;

    document.getElementById("toolName").innerHTML=name;

    document.querySelectorAll(".tool").forEach(button=>{
        button.classList.remove("active");
    });

    btn.classList.add("active");

}

function clearCanvas(){

    ctx.clearRect(0,0,canvas.width,canvas.height);
    previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);

}

function getMouse(e){

    const rect=canvas.getBoundingClientRect();

    return{
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };

}
function setStyle(target){
    target.strokeStyle=color;
    target.fillStyle=color;
    target.lineWidth=size;
    target.lineCap="round";
    target.lineJoin="round";
}

function drawFreeLine(x1,y1,x2,y2){
    setStyle(ctx);

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
}

function drawLine(target,x1,y1,x2,y2){
    setStyle(target);

    target.beginPath();
    target.moveTo(x1,y1);
    target.lineTo(x2,y2);
    target.stroke();
}

function drawRectangle(target,x1,y1,x2,y2){
    setStyle(target);

    let left=Math.min(x1,x2);
    let top=Math.min(y1,y2);
    let width=Math.abs(x2-x1);
    let height=Math.abs(y2-y1);

    target.strokeRect(left,top,width,height);
}

function drawCircle(target,x1,y1,x2,y2){

    setStyle(target);

    let left=Math.min(x1,x2);
    let top=Math.min(y1,y2);

    let width=Math.abs(x2-x1);
    let height=Math.abs(y2-y1);

    target.beginPath();

    target.ellipse(
        left+width/2,
        top+height/2,
        width/2,
        height/2,
        0,
        0,
        Math.PI*2
    );

    target.stroke();

}

function erase(x,y){
    ctx.clearRect(
        x-size/2,
        y-size/2,
        size,
        size
    );
}

function clearPreview(){
    previewCtx.clearRect(
        0,
        0,
        previewCanvas.width,
        previewCanvas.height
    );
}
canvas.addEventListener("mousedown",function(e){

    const pos=getMouse(e);

    if(tool=="fill"){
        fill(pos.x,pos.y);
        return;
    }

    drawing=true;

    startX=pos.x;
    startY=pos.y;

    lastX=pos.x;
    lastY=pos.y;

});

canvas.addEventListener("mousemove",function(e){

    if(!drawing) return;

    const pos=getMouse(e);

    if(tool=="pencil"){

        drawFreeLine(lastX,lastY,pos.x,pos.y);

        lastX=pos.x;
        lastY=pos.y;

    }

    else if(tool=="eraser"){
        erase(pos.x,pos.y);

    }
    else{

        clearPreview();

        if(tool=="line"){

            drawLine(
                previewCtx,
                startX,
                startY,
                pos.x,
                pos.y
            );
        }
        else if(tool=="rect"){
            drawRectangle(
                previewCtx,
                startX,
                startY,
                pos.x,
                pos.y
            );
        }
        else if(tool=="circle"){
            drawCircle(
                previewCtx,
                startX,
                startY,
                pos.x,
                pos.y
            );
        }
    }
});

canvas.addEventListener("mouseup",function(e){

    if(!drawing) return;

    drawing=false;

    const pos=getMouse(e);

    clearPreview();

    if(tool=="line"){
        drawLine(
            ctx,
            startX,
            startY,
            pos.x,
            pos.y
        );

    }

    else if(tool=="rect"){
        drawRectangle(
            ctx,
            startX,
            startY,
            pos.x,
            pos.y
        );

    }

    else if(tool=="circle"){
        drawCircle(
            ctx,
            startX,
            startY,
            pos.x,
            pos.y
        );

    }

});
canvas.addEventListener("mouseleave",function(){

    if(!drawing) return;

    drawing=false;

    clearPreview();

});
function hexToRgb(hex){
    return{
        r:parseInt(hex.substring(1,3),16),
        g:parseInt(hex.substring(3,5),16),
        b:parseInt(hex.substring(5,7),16)
    };
}
function fill(x,y){

    x=Math.floor(x);
    y=Math.floor(y);

    const image=ctx.getImageData(0,0,canvas.width,canvas.height);
    const data=image.data;

    const newColor=hexToRgb(color);

    const start=(y*canvas.width+x)*4;

    const targetR=data[start];
    const targetG=data[start+1];
    const targetB=data[start+2];
    const targetA=data[start+3];

    if(
        targetR==newColor.r &&
        targetG==newColor.g &&
        targetB==newColor.b
    ){
        return;
    }
    const stack=[];
    stack.push([x,y]);

    while(stack.length>0){

        const point=stack.pop();

        const px=point[0];
        const py=point[1];

        if(px<0||px>=canvas.width||py<0||py>=canvas.height){
            continue;
        }

        const index=(py*canvas.width+px)*4;

        if(
            data[index]!=targetR ||
            data[index+1]!=targetG ||
            data[index+2]!=targetB ||
            data[index+3]!=targetA
        ){
            continue;
        }

        data[index]=newColor.r;
        data[index+1]=newColor.g;
        data[index+2]=newColor.b;
        data[index+3]=255;

        stack.push([px+1,py]);
        stack.push([px-1,py]);
        stack.push([px,py+1]);
        stack.push([px,py-1]);

    }
    ctx.putImageData(image,0,0);
}

</script>
</body>
</html>
